// Configuració de BIND9 (D-NCC)
// Aquest fitxer substitueix tota la carpeta /etc/bind de la imatge,
// per això no inclou cap altre fitxer: ha de funcionar sol.

options {
    directory "/var/cache/bind";

    // Respon a qualsevol equip de les nostres xarxes
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { 172.29.88.0/24; 172.29.99.0/24; 127.0.0.1; };

    // Els noms que no són nostres els pregunta a DNS públics
    recursion yes;
    allow-recursion { 172.29.88.0/24; 172.29.99.0/24; 127.0.0.1; };
    forwarders { 8.8.8.8; 1.1.1.1; };
    forward only;

    dnssec-validation no;
};

// Zona interna del projecte
zone "asix.local" {
    type master;
    file "/var/lib/bind/db.asix.local";
};
